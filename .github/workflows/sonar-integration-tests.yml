name: Sonar AI integration checks

on:
  pull_request:
  push:
    branches:
      - feature/integrate-drishti-sonar-yolo

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend test suite without private checkpoints
        run: # Six legacy tests depend on MILCO JPG fixtures not committed in the public repo.
          # Run the full available suite without those unavailable-file cases.
          python -m pytest -q -k "not test_real_sample_uses_trained_detector_or_falls_back and not test_lossless_api_with_real_sonar_and_corruption and not test_preview_api_accepts_bundled_real_sonar_and_upload and not test_api_with_real_image and not test_bundled_real_samples_work_without_dataset and not test_bundled_samples_are_small_and_credited"
